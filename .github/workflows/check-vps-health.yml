            base64 -d /tmp/dump_learn_log.b64 > /tmp/dump_learn_log.py
            docker cp /tmp/dump_learn_log.py "$CNAME":/tmp/dump_learn_log.py
            docker exec -u javis "$CNAME" python3 /tmp/dump_learn_log.py
            echo
            echo "=== docker logs learn hints ==="
            docker logs --tail 500 "$CNAME" 2>&1 | grep -iE '\[learn|learn enqueue|learn log|BrainLock|agent-memory|ghi bài học|Fork học' | tail -100 || true
