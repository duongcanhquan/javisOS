# Kiểm tra sức khoẻ Javis trên VPS (workflow_dispatch).
name: Check VPS Health

on:
  workflow_dispatch:

# Một hàng SSH vào VPS tại một thời điểm (không đua với Deploy).
concurrency:
  group: vps-ssh
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Health + connections on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            DIR="${{ secrets.VPS_DIR }}"
            if [ -z "$DIR" ]; then DIR="$HOME/javis-os"; fi
            cd "$DIR"
            git fetch --all --prune 2>/dev/null || true
            git reset --hard origin/main 2>/dev/null || true
            chmod +x scripts/check-vps-health.sh
            bash scripts/check-vps-health.sh
