# Dump nhật ký tự học trên VPS (tạm thời, để chẩn đoán thất bại ghi).
name: Check VPS Health

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Dump learn-log on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            CNAME=$(docker ps --format '{{.Names}}' | grep -E 'javis' | head -1 || true)
            echo "container=$CNAME"
            if [ -z "$CNAME" ]; then echo "NO_CONTAINER"; exit 1; fi
            curl -fsS -m 5 http://127.0.0.1:7777/health || echo HEALTH_FAIL
