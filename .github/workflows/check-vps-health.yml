# Kiểm tra sức khoẻ Javis trên VPS (workflow_dispatch).
name: Check VPS Health

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Health + connections on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            echo "=== HOST ==="
            hostname
            date -Is
            echo
            echo "=== DOCKER ==="
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
            echo
            CNAME="${JAVIS_NAME:-javis}"
            if ! docker ps --format '{{.Names}}' | grep -qx "$CNAME"; then
              CNAME=$(docker ps --format '{{.Names}}' | grep -E 'javis' | head -1 || true)
            fi
            echo "container=$CNAME"
            echo
            echo "=== /health (localhost) ==="
            curl -fsS -m 8 http://127.0.0.1:7777/health || echo "HEALTH_FAIL"
            echo
            echo
            echo "=== VERSION / git ==="
            DIR="${{ secrets.VPS_DIR }}"
            if [ -z "$DIR" ]; then DIR="$HOME/javis-os"; fi
            if [ -d "$DIR" ]; then
              cd "$DIR"
              echo "dir=$DIR"
              git rev-parse --short HEAD 2>/dev/null || true
              git log -1 --oneline 2>/dev/null || true
              grep -E '^(GEMINI_FORCE_FILE_STORAGE|JAVIS_ENABLE_USER_PLUGINS)=' .env 2>/dev/null || echo "(no matching .env keys)"
            fi
            echo
            if [ -n "$CNAME" ]; then
              echo "=== ANTIGRAVITY ==="
              docker exec -u javis "$CNAME" bash -lc 'export PATH="$HOME/.local/bin:$PATH"; command -v agy; echo GEMINI_FORCE_FILE_STORAGE=${GEMINI_FORCE_FILE_STORAGE:-unset}; ls -ld ~/.gemini ~/.antigravity 2>/dev/null || true; agy models 2>&1 | head -20' || echo "AGY_CHECK_FAIL"
              echo
              echo "=== CONNECT HEALTH (API trong container) ==="
              docker exec "$CNAME" python -c 'import json,urllib.request
paths=["/health","/connect/health","/mcp/list","/providers","/claude/status"]
for path in paths:
  try:
    with urllib.request.urlopen("http://127.0.0.1:7777"+path, timeout=25) as r:
      body=r.read().decode("utf-8","replace")
    print("==", path, "HTTP", r.status)
    data=json.loads(body) if body.strip().startswith(("{","[")) else body
    if path=="/connect/health":
      if not data: print("(empty)")
      else:
        for cid,rec in data.items():
          print(" ", cid, "ok="+str(rec.get("ok")), "tools="+str(rec.get("tools")), rec.get("message") or "")
    elif path=="/mcp/list":
      items=data if isinstance(data,list) else data.get("items") or data.get("connections") or data.get("mcp") or []
      if isinstance(data,dict) and not items:
        print(json.dumps({k:data.get(k) for k in list(data)[:12]}, ensure_ascii=False)[:1500])
      for c in items:
        if isinstance(c,dict):
          print(" ", c.get("id"), "enabled="+str(c.get("enabled")), c.get("label") or c.get("name") or "")
        else:
          print(" ", c)
    elif path=="/providers":
      items=data if isinstance(data,list) else data.get("providers") or []
      for p in items:
        if isinstance(p,dict):
          print(" ", p.get("id"), "connected="+str(p.get("connected")), "cli="+str(p.get("cli_found")), "models="+str(len(p.get("models") or [])), (p.get("auth_error") or "")[:100])
    elif path=="/claude/status":
      print(json.dumps(data, ensure_ascii=False)[:500] if isinstance(data,dict) else str(data)[:500])
    else:
      print(str(data)[:300] if not isinstance(data,str) else data[:300])
  except Exception as e:
    print("==", path, "ERR", type(e).__name__, e)
' || echo "CONNECT_API_FAIL"
            fi
            echo
            echo "=== DONE ==="
