# Deploy OpenMAIC lên cùng VPS với Javis.
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (đã có).
# Tuỳ chọn: OPENMAIC_GOOGLE_API_KEY — nếu trống, script lấy gemini_api_key từ container Javis.
name: Deploy OpenMAIC to VPS

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Subdomain OpenMAIC (DNS A trỏ về VPS)"
        required: true
        default: "openmaic.vietmycollege.com"
      build_from_source:
        description: "Build từ source upstream (1) hay image community nhanh (0). VPS nhỏ dùng 0."
        required: true
        default: "0"
      sync_key_only:
        description: "Chỉ sync Gemini key+model vào OpenMAIC + restart (1) hay full deploy (0)"
        required: true
        default: "0"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-openmaic-vps.yml"
      - "scripts/vps-deploy-openmaic.sh"
      - "deploy/openmaic/**"

concurrency:
  group: openmaic-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout javisOS (script deploy)
        uses: actions/checkout@v4

      - name: Upload deploy script to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "scripts/vps-deploy-openmaic.sh"
          target: "/tmp/javis-openmaic-deploy/"
          strip_components: 1

      - name: Deploy OpenMAIC over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          OPENMAIC_GOOGLE_API_KEY: ${{ secrets.OPENMAIC_GOOGLE_API_KEY }}
          OPENMAIC_DOMAIN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.domain || 'openmaic.vietmycollege.com' }}
          OPENMAIC_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_from_source || '0' }}
          OPENMAIC_SYNC_KEY_ONLY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sync_key_only || '0' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 60m
          envs: OPENMAIC_GOOGLE_API_KEY,OPENMAIC_DOMAIN,OPENMAIC_BUILD,OPENMAIC_SYNC_KEY_ONLY
          script: |
            set -euo pipefail
            DIR="${{ secrets.VPS_DIR }}"
            if [ -z "$DIR" ]; then DIR="$HOME/javis-os"; fi
            mkdir -p "$DIR/scripts"
            # Script từ Actions runner (không phụ thuộc git trên VPS bị kẹt SHA cũ)
            if [ -f /tmp/javis-openmaic-deploy/vps-deploy-openmaic.sh ]; then
              cp -f /tmp/javis-openmaic-deploy/vps-deploy-openmaic.sh "$DIR/scripts/vps-deploy-openmaic.sh"
              echo "==> Đã copy script từ Actions → $DIR/scripts/vps-deploy-openmaic.sh"
            elif [ -d "$DIR/.git" ]; then
              cd "$DIR"
              git fetch --depth 50 origin main || git fetch origin main || true
              git reset --hard origin/main || true
              echo "==> VPS git HEAD: $(git log -1 --oneline 2>/dev/null || echo unknown)"
            fi
            if [ ! -f "$DIR/scripts/vps-deploy-openmaic.sh" ]; then
              echo "ERROR: thiếu $DIR/scripts/vps-deploy-openmaic.sh"
              exit 1
            fi
            chmod +x "$DIR/scripts/vps-deploy-openmaic.sh"
            export OPENMAIC_GOOGLE_API_KEY OPENMAIC_DOMAIN OPENMAIC_BUILD OPENMAIC_SYNC_KEY_ONLY
            export OPENMAIC_DIR="${OPENMAIC_DIR:-$HOME/openmaic}"
            export OPENMAIC_ALLOW_NO_KEY=0
            export JAVIS_OS_DIR="$DIR"
            # Nếu user đã chọn OpenAI/DeepSeek trên UI nhưng container còn Gemini: giữ JSON.
            # Chỉ seed openai khi chưa có file (lần đầu).
            docker exec -i javis python3 - <<'PY' || true
from pathlib import Path
import json
p = Path("/data/state/openmaic_llm.json")
if not p.is_file():
    p.parent.mkdir(parents=True, exist_ok=True)
    p.write_text(json.dumps({
        "provider": "openai",
        "model": "gpt-4o-mini",
        "updated": "seed",
    }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
    print("seeded openmaic_llm.json → openai")
else:
    print("keep", p.read_text(encoding="utf-8")[:200])
PY
            bash "$DIR/scripts/vps-deploy-openmaic.sh"
            # Xác nhận model trong file + trong process container (restart không đủ — recreate ở script)
            ENV_FILE="${OPENMAIC_DIR}/.env.local"
            if [ -f "$ENV_FILE" ]; then
              echo "==> .env.local model lines:"
              grep -E '^(DEFAULT_MODEL|DEFAULT_PROVIDER|GOOGLE_API_KEY)=' "$ENV_FILE" | sed 's/GOOGLE_API_KEY=.*/GOOGLE_API_KEY=***/' || true
            fi
            echo "==> Container DEFAULT_MODEL:"
            docker exec openmaic sh -c 'echo DEFAULT_MODEL=$DEFAULT_MODEL; echo DEFAULT_PROVIDER=$DEFAULT_PROVIDER' 2>/dev/null || echo "(no container)"
            echo "==> openmaic_llm.json trên Javis:"
            docker exec javis sh -c 'cat /data/state/openmaic_llm.json 2>/dev/null || echo (none)' 2>/dev/null || true
            echo "==> Javis docker.sock:"
            docker exec javis python3 -c "from pathlib import Path; print('sock', Path('/var/run/docker.sock').exists())" 2>/dev/null || echo "(no)"
