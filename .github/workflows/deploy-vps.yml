# Tự deploy lên VPS mỗi khi push lên main (GitHub → Ubuntu).
# Cần Secrets trên repo:
#   VPS_HOST          ví dụ 165.101.46.238
#   VPS_USER          root
#   VPS_SSH_KEY       private key (nội dung file id_ed25519 deploy)
#   VPS_DIR           ~/javis-os  (tuỳ chọn)
name: Deploy Javis to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -euo pipefail
            DIR="${{ secrets.VPS_DIR }}"
            if [ -z "$DIR" ]; then DIR="$HOME/javis-os"; fi
            cd "$DIR"
            export COMPOSE_PROJECT_NAME=javis
            bash scripts/vps-deploy.sh
