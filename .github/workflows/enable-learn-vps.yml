# Bật Tự học + git-init brain trên VPS Ubuntu (workflow_dispatch).
name: Enable Learn on VPS

on:
  workflow_dispatch:

# Một hàng SSH vào VPS tại một thời điểm (không đua với Deploy).
concurrency:
  group: vps-ssh
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable learn + git-init in javis container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            DIR="${{ secrets.VPS_DIR }}"
            if [ -z "$DIR" ]; then DIR="$HOME/javis-os"; fi
            cd "$DIR"
            chmod +x scripts/enable-learn-vps.sh
            bash scripts/enable-learn-vps.sh
