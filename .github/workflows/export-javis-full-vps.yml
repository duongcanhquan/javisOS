# Đóng gói FULL volume Javis trên VPS → artifact (stream, không nhân đôi đĩa).
name: Export Javis full from VPS

on:
  workflow_dispatch:

concurrency:
  group: vps-ssh
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Stream-pack volumes from VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSH=(ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=60 -i ~/.ssh/id_ed25519 "$USER@$HOST")

          "${SSH[@]}" 'set -euo pipefail
            rm -rf /tmp/javis-full-export /tmp/javis-full.tgz || true
            df -h / /var/lib/docker 2>/dev/null | head -20 || df -h | head -20
            CONTAINER=javis
            if ! docker ps -a --format "{{.Names}}" | grep -qx "$CONTAINER"; then
              CONTAINER=$(docker ps -a --format "{{.Names}}" | grep -E "javis" | head -1 || true)
            fi
            test -n "$CONTAINER"
            docker start "$CONTAINER" 2>/dev/null || true
            echo "OK container=$CONTAINER"
          '

          # Stream: stop → docker tar stdout → file trên runner → start
          "${SSH[@]}" 'set -euo pipefail
            CONTAINER=javis
            if ! docker ps -a --format "{{.Names}}" | grep -qx "$CONTAINER"; then
              CONTAINER=$(docker ps -a --format "{{.Names}}" | grep -E "javis" | head -1 || true)
            fi
            DATA=""; BRAINS=""; CLAUDE=""; CODEX=""
            while read -r dest name typ; do
              [ "$typ" = "volume" ] || continue
              case "$dest" in
                /data) DATA="$name" ;;
                /brains) BRAINS="$name" ;;
                /home/javis/.claude) CLAUDE="$name" ;;
                /home/javis/.codex) CODEX="$name" ;;
              esac
            done < <(docker inspect -f "{{range .Mounts}}{{println .Destination .Name .Type}}{{end}}" "$CONTAINER")
            echo "data=$DATA brains=$BRAINS claude=$CLAUDE codex=$CODEX" >&2
            test -n "$DATA" && test -n "$BRAINS"
            docker stop "$CONTAINER"
            ARGS=(-v "$DATA:/pack/data:ro" -v "$BRAINS:/pack/brains:ro")
            EXTRAS=""
            if [ -n "$CLAUDE" ]; then ARGS+=(-v "$CLAUDE:/pack/claude:ro"); EXTRAS="$EXTRAS claude"; fi
            if [ -n "$CODEX" ]; then ARGS+=(-v "$CODEX:/pack/codex:ro"); EXTRAS="$EXTRAS codex"; fi
            # stdout = tar stream (nén trên VPS nhưng KHÔNG ghi file tar lên đĩa VPS)
            docker run --rm "${ARGS[@]}" alpine \
              tar -C /pack -czf - \
                --exclude=node_modules \
                --exclude=.pnpm-store \
                --exclude=.git \
                data brains $EXTRAS
            EC=$?
            docker start "$CONTAINER" || true
            exit $EC
          ' > ./javis-full.tgz

          ls -lh ./javis-full.tgz
          python3 - <<'PY'
          import os, tarfile, sys
          p = "javis-full.tgz"
          n = os.path.getsize(p)
          print(f"bytes={n}")
          if n < 1_000_000:
              raise SystemExit("artifact too small")
          with tarfile.open(p) as t:
              names = t.getnames()
              tops = sorted({x.split("/", 1)[0] for x in names if x and not x.startswith(".")})
              print("tops:", tops)
              print("entries:", len(names))
              print("sample:", names[:20])
              if "data" not in tops or "brains" not in tops:
                  raise SystemExit("missing data/brains in archive")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: javis-full-from-vps
          path: javis-full.tgz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
