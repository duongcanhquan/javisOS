# One-shot: vá env + terminal agy trên tenant (SSH_TTY / FORCE_FILE).
# bump: 2026-10-26T00:40Z — một file self-extract (scp đơn, giống reclaim)
name: Fix agy login once

on:
  push:
    paths:
      - ".github/workflows/fix-agy-login-once.yml"
      - "scripts/fix-agy-login-tenants-vps.sh"
      - "server/terminal.py"
      - "server/antigravity_cli.py"
  workflow_dispatch:

concurrency:
  group: vps-ssh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build self-extract bundle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import gzip, base64
          out = Path("scripts/fix-agy-login-bundle.sh")
          lines = ["#!/usr/bin/env bash", "set -euo pipefail", "DIR=\"${JAVIS_DIR:-$HOME/javis-os}\"", "mkdir -p \"$DIR/scripts\" \"$DIR/server\"", ""]
          for rel, dest in [
              ("scripts/fix-agy-login-tenants-vps.sh", "$DIR/scripts/fix-agy-login-tenants-vps.sh"),
              ("server/terminal.py", "$DIR/server/terminal.py"),
              ("server/antigravity_cli.py", "$DIR/server/antigravity_cli.py"),
          ]:
              raw = Path(rel).read_bytes()
              b64 = base64.b64encode(gzip.compress(raw, 9)).decode("ascii")
              lines.append(f"python3 - <<'PY'\nimport gzip,base64,pathlib\npathlib.Path('''{dest}'''.replace('$DIR', __import__('os').environ.get('DIR') or __import__('os').environ.get('JAVIS_DIR') or __import__('os').path.expanduser('~/javis-os'))).write_bytes(gzip.decompress(base64.b64decode('''{b64}''')))\nPY")
          # Simpler: write with shell DIR
          lines = ["#!/usr/bin/env bash", "set -euo pipefail",
                   "DIR=\"${JAVIS_DIR:-}\"",
                   "if [ -z \"$DIR\" ]; then",
                   "  if [ -d \"$HOME/javis-os\" ]; then DIR=\"$HOME/javis-os\"",
                   "  elif [ -d /root/javis-os ]; then DIR=/root/javis-os",
                   "  else DIR=\"$HOME/javis-os\"; mkdir -p \"$DIR\"",
                   "  fi",
                   "fi",
                   "mkdir -p \"$DIR/scripts\" \"$DIR/server\"",
                   "export JAVIS_DIR=\"$DIR\""]
          mapping = [
              ("scripts/fix-agy-login-tenants-vps.sh", "scripts/fix-agy-login-tenants-vps.sh"),
              ("server/terminal.py", "server/terminal.py"),
              ("server/antigravity_cli.py", "server/antigravity_cli.py"),
          ]
          for rel, dest in mapping:
              raw = Path(rel).read_bytes()
              b64 = base64.b64encode(gzip.compress(raw, 9)).decode("ascii")
              lines.append(f"echo 'unpack {dest}'")
              lines.append(f"printf '%s' '{b64}' | base64 -d | gzip -d > \"$DIR/{dest}\"")
          lines.append("chmod +x \"$DIR/scripts/fix-agy-login-tenants-vps.sh\"")
          lines.append("wc -c \"$DIR/scripts/fix-agy-login-tenants-vps.sh\" \"$DIR/server/terminal.py\" \"$DIR/server/antigravity_cli.py\"")
          lines.append("bash \"$DIR/scripts/fix-agy-login-tenants-vps.sh\"")
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("bundle", out, "bytes", out.stat().st_size)
          PY
          chmod +x scripts/fix-agy-login-bundle.sh
          wc -c scripts/fix-agy-login-bundle.sh

      - name: Prep remote + upload bundle
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            df -h / /tmp "$HOME" | head -20
            mkdir -p "$HOME/javis-fix-agy"
            rm -f "$HOME/javis-fix-agy"/* || true

      - name: Upload bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "scripts/fix-agy-login-bundle.sh"
          target: "javis-fix-agy/"
          overwrite: true

      - name: Run bundle over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -euo pipefail
            DIR="${{ secrets.VPS_DIR }}"
            if [ -z "$DIR" ]; then DIR="$HOME/javis-os"; fi
            export JAVIS_DIR="$DIR"
            BUNDLE=""
            for c in "$HOME/javis-fix-agy/fix-agy-login-bundle.sh" \
                      "$HOME/javis-fix-agy/scripts/fix-agy-login-bundle.sh"; do
              [ -f "$c" ] && BUNDLE="$c" && break
            done
            if [ -z "$BUNDLE" ]; then
              echo "FAIL: bundle missing"
              ls -laR "$HOME/javis-fix-agy" || true
              exit 1
            fi
            chmod +x "$BUNDLE"
            bash "$BUNDLE"
