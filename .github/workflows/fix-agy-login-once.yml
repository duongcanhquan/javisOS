# One-shot: vá env + terminal agy trên tenant (SSH_TTY / FORCE_FILE).
# bump: 2026-10-26T00:20Z
name: Fix agy login once

on:
  push:
    paths:
      - ".github/workflows/fix-agy-login-once.yml"
      - "scripts/fix-agy-login-tenants-vps.sh"
      - "server/terminal.py"
      - "server/antigravity_cli.py"
  workflow_dispatch:

concurrency:
  group: vps-ssh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Upload fix files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "scripts/fix-agy-login-tenants-vps.sh,server/terminal.py,server/antigravity_cli.py"
          target: "/tmp/javis-fix-agy/"

      - name: Diagnose and fix agy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -euo pipefail
            DIR="${{ secrets.VPS_DIR }}"
            if [ -z "$DIR" ]; then DIR="$HOME/javis-os"; fi
            mkdir -p "$DIR/scripts" "$DIR/server"
            if [ -f /tmp/javis-fix-agy/scripts/fix-agy-login-tenants-vps.sh ]; then
              cp -f /tmp/javis-fix-agy/scripts/fix-agy-login-tenants-vps.sh "$DIR/scripts/"
            elif [ -f /tmp/javis-fix-agy/fix-agy-login-tenants-vps.sh ]; then
              cp -f /tmp/javis-fix-agy/fix-agy-login-tenants-vps.sh "$DIR/scripts/fix-agy-login-tenants-vps.sh"
            fi
            for f in terminal.py antigravity_cli.py; do
              if [ -f "/tmp/javis-fix-agy/server/$f" ]; then
                cp -f "/tmp/javis-fix-agy/server/$f" "$DIR/server/$f"
              elif [ -f "/tmp/javis-fix-agy/$f" ]; then
                cp -f "/tmp/javis-fix-agy/$f" "$DIR/server/$f"
              fi
            done
            chmod +x "$DIR/scripts/fix-agy-login-tenants-vps.sh"
            export JAVIS_DIR="$DIR"
            bash "$DIR/scripts/fix-agy-login-tenants-vps.sh"
