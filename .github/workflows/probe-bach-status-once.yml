# bump: 2026-10-27T04:50Z — xóa usercustomize hỏng trên volume /data của bach
name: Probe bach status once

on:
  push:
    paths:
      - ".github/workflows/probe-bach-status-once.yml"
  workflow_dispatch:

concurrency:
  group: vps-ssh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Heal bach usercustomize on volume
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 12m
          script: |
            set -euo pipefail
            echo "=== BEFORE ==="
            date -u
            docker ps -a --filter name=javis-bach --format 'table {{.Names}}\t{{.Status}}'
            DATA_VOL="/var/lib/docker/volumes/javis-bach_javis-data/_data"
            UC="$DATA_VOL/home/.local/lib/python3.12/site-packages/usercustomize.py"
            echo "data_vol=$DATA_VOL"
            ls -la "$DATA_VOL/home/.local/lib/python3.12/site-packages/usercustomize.py"* 2>/dev/null || echo "no usercustomize on volume yet"
            wc -c "$UC" 2>/dev/null || true
            head -5 "$UC" 2>/dev/null || true

            echo "=== DISABLE broken usercustomize (persist /data) ==="
            docker stop javis-bach 2>/dev/null || true
            if [ -f "$UC" ]; then
              mv -f "$UC" "$UC.bad.$(date +%s)"
              echo "renamed_ok"
              ls -la "$DATA_VOL/home/.local/lib/python3.12/site-packages/usercustomize.py"* 2>/dev/null || true
            else
              echo "file_missing_try_alt"
              find "$DATA_VOL/home" -name 'usercustomize.py' 2>/dev/null | head -20 || true
              find "$DATA_VOL/home" -name 'usercustomize.py' 2>/dev/null | while read -r f; do
                mv -f "$f" "$f.bad.$(date +%s)"
                echo "renamed $f"
              done
            fi

            # Tránh Python vẫn nạp bản cache .pyc
            find "$DATA_VOL/home/.local" -name 'usercustomize*.pyc' -delete 2>/dev/null || true
            find "$DATA_VOL/home/.local" -path '*/__pycache__/usercustomize*' -delete 2>/dev/null || true

            docker start javis-bach
            echo "=== WAIT HEALTH ==="
            ok=0
            for i in $(seq 1 30); do
              ST=$(docker inspect javis-bach --format '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' 2>/dev/null || echo missing)
              echo "t=$i $ST"
              if echo "$ST" | grep -q 'running healthy'; then ok=1; break; fi
              if echo "$ST" | grep -Eq 'restarting|exited'; then
                echo "still_crash"
                docker logs --tail 15 javis-bach 2>&1 | tail -15 || true
              fi
              sleep 3
            done

            echo "=== AFTER ==="
            docker ps -a --filter name=javis-bach --format 'table {{.Names}}\t{{.Status}}'
            docker logs --tail 20 javis-bach 2>&1 | tail -20 || true
            docker exec -i javis-manager python - <<'PY'
            import sys
            sys.path.insert(0, "/app/server")
            import org_docker as od
            cname = "javis-bach"
            print("docker_status", od.container_status(cname), flush=True)
            try:
                print("serving_ready", od.container_serving_ready(cname), flush=True)
            except Exception as e:
                print("serving_err", e, flush=True)
            try:
                import urllib.request
                with urllib.request.urlopen("http://javis-bach:7777/health", timeout=5) as r:
                    print("health_http", r.status, flush=True)
            except Exception as e:
                print("health_http_err", type(e).__name__, e, flush=True)
            print("BACH_HEAL_DONE", flush=True)
            PY
            [ "$ok" = 1 ] && echo BACH_HEALTHY || echo BACH_STILL_BAD
