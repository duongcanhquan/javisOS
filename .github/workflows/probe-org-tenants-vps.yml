name: Probe org tenants on VPS
on:
  workflow_dispatch:
concurrency:
  group: vps-ssh
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List tenants
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            echo "=== ALL javis containers (inc stopped) ==="
            docker ps -a --format 'table {{.Names}}\t{{.Status}}' | grep -E '^javis-|NAMES' || true
            echo "=== tenant count via manager ==="
            docker exec javis-manager python - <<'PY' || true
            import sys
            sys.path.insert(0, "/app/server")
            import org_tenants as ot
            import org_coord as oc
            import org_docker as od
            d = ot.load()
            ts = d.get("tenants") or []
            print("tenants_in_registry", len(ts))
            for t in ts:
                slug = t.get("slug")
                print(" -", slug, "paused=", bool(t.get("paused")), "deleted=", bool(t.get("deleted_at")), "prot=", bool(t.get("protected")), "container=", t.get("container"))
            c = oc.coord()
            print("suggest", c.get("suggest"), "max_running", c.get("max_running"), "effective", oc.effective_max())
            try:
                run = od.people_running()
                print("people_running", len(run), [x.get("slug") for x in run])
            except Exception as e:
                print("people_running err", e)
            PY
