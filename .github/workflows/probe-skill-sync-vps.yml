# Đo skill manager vs tenant (workflow_dispatch). Không deploy.
name: Probe skill sync on VPS

"on":
  workflow_dispatch:

concurrency:
  group: vps-ssh
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe skills over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            SLUGS="soan-thao-luan-van academic-research-agent paper-qa-evidence xuat-goi-nghien-cuu"
            echo "=== HANG STATUS ==="
            docker ps -a --filter name=^javis-hang$ --format '{{.Names}} {{.Status}}'
            echo "=== HANG BRAINS ==="
            docker exec javis-hang ls -1 /brains
            echo "=== MANAGER SOURCE ==="
            for s in $SLUGS; do
              if docker exec javis-manager test -f "/brains/Brain Default/skills/$s/SKILL.md"; then
                echo "SRC $s"
              else
                echo "NO_SRC $s"
              fi
            done
            list_hang() {
              docker exec javis-hang sh -c '
                for b in /brains/*; do
                  [ -d "$b" ] || continue
                  echo "## $(basename "$b")"
                  for s in soan-thao-luan-van academic-research-agent paper-qa-evidence xuat-goi-nghien-cuu; do
                    if [ -f "$b/skills/$s/SKILL.md" ]; then echo "HAS $s"
                    elif [ -d "$b/skills/.disabled/$s" ]; then echo "DISABLED $s"
                    else echo "MISS $s"; fi
                  done
                done
              '
            }
            echo "=== BEFORE ==="
            list_hang
            echo "=== COPY ==="
            docker exec javis-hang sh -c 'for b in /brains/*; do [ -d "$b" ] && basename "$b"; done' > /tmp/hang-brains.txt
            while IFS= read -r b; do
              [ -n "$b" ] || continue
              echo "brain=$b"
              docker exec -u root javis-hang mkdir -p "/brains/$b/skills" "/brains/$b/.claude/skills"
              for s in $SLUGS; do
                if ! docker exec javis-manager test -f "/brains/Brain Default/skills/$s/SKILL.md"; then
                  echo "NO_SRC $s"
                  continue
                fi
                if docker exec javis-hang test -d "/brains/$b/skills/.disabled/$s"; then
                  echo "SKIP_DISABLED $b / $s"
                  continue
                fi
                need=1
                if docker exec javis-hang test -f "/brains/$b/skills/$s/SKILL.md"; then
                  h1=$(docker exec javis-manager sha256sum "/brains/Brain Default/skills/$s/SKILL.md" | awk '{print $1}')
                  h2=$(docker exec javis-hang sha256sum "/brains/$b/skills/$s/SKILL.md" | awk '{print $1}')
                  if [ "$h1" = "$h2" ]; then
                    echo "SAME $b / $s"
                    need=0
                  else
                    echo "DIFF $b / $s"
                  fi
                else
                  echo "INSTALL $b / $s"
                fi
                if [ "$need" = 1 ]; then
                  docker exec javis-manager tar -C "/brains/Brain Default/skills" -cf - "$s" | docker exec -i -u root javis-hang tar -C "/brains/$b/skills" -xf -
                  docker exec -u root javis-hang sh -c "rm -rf \"/brains/$b/.claude/skills/$s\" && cp -a \"/brains/$b/skills/$s\" \"/brains/$b/.claude/skills/$s\" && chown -R --reference=\"/brains/$b\" \"/brains/$b/skills/$s\" \"/brains/$b/.claude/skills/$s\""
                  echo "COPIED $b / $s"
                fi
              done
            done < /tmp/hang-brains.txt
            echo "=== AFTER ==="
            list_hang
            echo HANG_SKILL_DONE
