# Kéo caps + memory gọn từ 2 brain trên VPS (không kéo cả vault nặng).
name: Pull brains from VPS

on:
  workflow_dispatch:

concurrency:
  group: vps-ssh
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pack agents/workflows/skills/memory from VPS brains
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSH=(ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 "$USER@$HOST")
          "${SSH[@]}" 'set -euo pipefail
            CONTAINER=javis
            if ! docker ps --format "{{.Names}}" | grep -qx "$CONTAINER"; then
              CONTAINER=$(docker ps --format "{{.Names}}" | grep -E "javis" | head -1 || true)
            fi
            test -n "$CONTAINER"
            echo "container=$CONTAINER"
            docker exec "$CONTAINER" sh -c "ls -la /brains"
            docker exec "$CONTAINER" sh -c "
              set -e
              rm -rf /tmp/brains-light && mkdir -p /tmp/brains-light
              for b in /brains/*; do
                [ -d \"\$b\" ] || continue
                name=\$(basename \"\$b\")
                echo \"pack \$name\"
                mkdir -p \"/tmp/brains-light/\$name\"
                for sub in agents workflows skills memory Javis; do
                  if [ -d \"\$b/\$sub\" ]; then
                    # skills: chỉ SKILL.md + yaml, bỏ scripts nặng
                    if [ \"\$sub\" = skills ]; then
                      mkdir -p \"/tmp/brains-light/\$name/skills\"
                      for sk in \"\$b/skills\"/*; do
                        [ -d \"\$sk\" ] || continue
                        sn=\$(basename \"\$sk\")
                        mkdir -p \"/tmp/brains-light/\$name/skills/\$sn\"
                        cp -f \"\$sk\"/SKILL.md \"/tmp/brains-light/\$name/skills/\$sn/\" 2>/dev/null || true
                        cp -f \"\$sk\"/*.yaml \"/tmp/brains-light/\$name/skills/\$sn/\" 2>/dev/null || true
                        cp -f \"\$sk\"/*.yml \"/tmp/brains-light/\$name/skills/\$sn/\" 2>/dev/null || true
                        # giữ script nhỏ của xuat-goi
                        if [ -d \"\$sk/scripts\" ] && [ \"\$sn\" = xuat-goi-nghien-cuu ]; then
                          cp -a \"\$sk/scripts\" \"/tmp/brains-light/\$name/skills/\$sn/\"
                        fi
                      done
                    else
                      cp -a \"\$b/\$sub\" \"/tmp/brains-light/\$name/\"
                    fi
                  fi
                done
              done
              cd /tmp/brains-light && tar -czf /tmp/javis-brains.tgz .
              ls -lh /tmp/javis-brains.tgz
              tar -tzf /tmp/javis-brains.tgz | head -80
            "
            docker cp "$CONTAINER:/tmp/javis-brains.tgz" /tmp/javis-brains.tgz
            ls -lh /tmp/javis-brains.tgz
          '
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 \
            "$USER@$HOST:/tmp/javis-brains.tgz" ./javis-brains.tgz
          ls -lh ./javis-brains.tgz
          tar -tzf ./javis-brains.tgz | head -80

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: javis-brains-from-vps
          path: javis-brains.tgz
          if-no-files-found: error
          retention-days: 3
