# Kéo brain từ VPS (gọn: không .git objects, không media lớn) về artifact.
name: Pull brains from VPS

on:
  workflow_dispatch:

concurrency:
  group: vps-ssh
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Tar brains (light) on VPS + download
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSH=(ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 "$USER@$HOST")
          "${SSH[@]}" 'set -euo pipefail
            CONTAINER=javis
            if ! docker ps --format "{{.Names}}" | grep -qx "$CONTAINER"; then
              CONTAINER=$(docker ps --format "{{.Names}}" | grep -E "javis" | head -1 || true)
            fi
            test -n "$CONTAINER"
            echo "container=$CONTAINER"
            docker exec "$CONTAINER" sh -c "ls -la /brains"
            docker exec "$CONTAINER" sh -c "
              cd /brains && tar -czf /tmp/javis-brains.tgz \
                --exclude=\"./.DS_Store\" \
                --exclude=\"./lost+found\" \
                --exclude=\"*/.git\" \
                --exclude=\"*/node_modules\" \
                --exclude=\"*/exports\" \
                --exclude=\"*/attachments\" \
                --exclude=\"*/.claude/worktrees\" \
                --exclude=\"*/skills/*/scripts/node_modules\" \
                .
            "
            docker cp "$CONTAINER:/tmp/javis-brains.tgz" /tmp/javis-brains.tgz
            ls -lh /tmp/javis-brains.tgz
          '
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 \
            "$USER@$HOST:/tmp/javis-brains.tgz" ./javis-brains.tgz
          ls -lh ./javis-brains.tgz
          echo "=== top entries ==="
          tar -tzf ./javis-brains.tgz | awk -F/ 'NF<=2' | head -60

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: javis-brains-from-vps
          path: javis-brains.tgz
          if-no-files-found: error
          retention-days: 3
