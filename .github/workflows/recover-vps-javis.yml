# Gỡ container Javis kẹt tên rồi deploy lại (khi 502 / Conflict name).
name: Recover VPS Javis

on:
  workflow_dispatch:

# Một hàng SSH vào VPS tại một thời điểm (không đua với Deploy).
concurrency:
  group: vps-ssh
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve GHCR image
        id: img
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repo}:latest" >> "$GITHUB_OUTPUT"

      - name: Force remove stuck containers and redeploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          JAVIS_IMAGE: ${{ steps.img.outputs.image }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          envs: GHCR_TOKEN,GHCR_USER,JAVIS_IMAGE
          script: |
            set -euo pipefail
            DIR="${{ secrets.VPS_DIR }}"
            if [ -z "$DIR" ]; then DIR="$HOME/javis-os"; fi
            cd "$DIR"
            export COMPOSE_PROJECT_NAME=javis
            export JAVIS_IMAGE GHCR_TOKEN GHCR_USER
            echo "==> gỡ container kẹt tên"
            docker rm -f javis javis-pixelle-api javis-pixelle-web 2>/dev/null || true
            docker ps -aq --filter "name=javis" | while read -r cid; do
              [ -n "$cid" ] || continue
              docker rm -f "$cid" 2>/dev/null || true
            done
            rm -f .git/index.lock .git/refs/remotes/origin/main.lock 2>/dev/null || true
            git remote prune origin 2>/dev/null || true
            git fetch --all --prune || true
            git reset --hard origin/main || true
            # Kéo đúng image :latest đã publish (không --build trên VPS).
            export WANT_SHA="$(git rev-parse HEAD)"
            echo "==> WANT_SHA=$WANT_SHA image=$JAVIS_IMAGE"
            chmod +x scripts/vps-deploy.sh
            bash scripts/vps-deploy.sh
            curl -fsS -m 10 http://127.0.0.1:7777/health || true
            echo
            # Seed HTĐT không đụng git (script từ GitHub raw) - tránh race.
            curl -fsSL "https://raw.githubusercontent.com/duongcanhquan/javisOS/main/scripts/seed-htdt-profile-vps.sh" \
              -o /tmp/seed-htdt-profile-vps.sh
            chmod +x /tmp/seed-htdt-profile-vps.sh
            bash /tmp/seed-htdt-profile-vps.sh || echo "WARN: seed HTĐT sau - chạy lại workflow Seed"
