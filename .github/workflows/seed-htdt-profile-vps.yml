# Ghi Memory + agent/skill hồ sơ HTĐT (CĐ Việt Mỹ HN) lên brain VPS.
name: Seed HTĐT profile on VPS

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Seed memory/agents/skills over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            # Không đụng git checkout trên VPS (hay race với Deploy). Lấy script thẳng từ main.
            curl -fsSL "https://raw.githubusercontent.com/duongcanhquan/javisOS/main/scripts/seed-htdt-profile-vps.sh" \
              -o /tmp/seed-htdt-profile-vps.sh
            chmod +x /tmp/seed-htdt-profile-vps.sh
            bash /tmp/seed-htdt-profile-vps.sh
