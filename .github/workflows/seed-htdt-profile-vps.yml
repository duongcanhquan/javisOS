# Ghi Memory + agent/skill hồ sơ HTĐT (CĐ Việt Mỹ HN) lên brain VPS.
name: Seed HTĐT profile on VPS

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Seed memory/agents/skills over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            DIR="${{ secrets.VPS_DIR }}"
            if [ -z "$DIR" ]; then DIR="$HOME/javis-os"; fi
            cd "$DIR"
            # Tránh race với deploy song song (ref lock origin/main).
            for i in 1 2 3 4 5 6; do
              rm -f .git/refs/remotes/origin/main.lock .git/index.lock 2>/dev/null || true
              git remote prune origin 2>/dev/null || true
              if git fetch --all --prune && git reset --hard origin/main; then
                break
              fi
              echo "git bận - chờ 5s ($i/6)"
              sleep 5
              if [ "$i" = 6 ]; then
                echo "ERROR: git fetch/reset thất bại"
                exit 1
              fi
            done
            chmod +x scripts/seed-htdt-profile-vps.sh
            bash scripts/seed-htdt-profile-vps.sh
