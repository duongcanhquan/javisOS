# Đẩy token rclone Google Drive (remote gdrive:) vào /data/state/rclone.conf trên VPS.
# Chạy sau khi đã lấy token trên Mac:  rclone authorize "drive"
# hoặc double-click Cau-hinh-Rclone-Drive.command
#
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (giống Deploy)
name: Setup rclone Drive on VPS

on:
  workflow_dispatch:
    inputs:
      token:
        description: "Token JSON từ rclone authorize drive (cả khối { ... })"
        required: true
        type: string
      remote_name:
        description: "Tên remote rclone"
        required: false
        default: gdrive
        type: string

concurrency:
  group: vps-ssh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Write rclone remote on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          RCLONE_TOKEN: ${{ inputs.token }}
          REMOTE_NAME: ${{ inputs.remote_name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          envs: RCLONE_TOKEN,REMOTE_NAME
          script: |
            set -euo pipefail
            CONTAINER="${JAVIS_CONTAINER:-javis}"
            if ! docker ps --format '{{.Names}}' | grep -qx "$CONTAINER"; then
              echo "ERROR: container $CONTAINER khong chay"
              docker ps -a --format '{{.Names}} {{.Status}}' || true
              exit 1
            fi
            if ! docker exec "$CONTAINER" which rclone >/dev/null 2>&1; then
              echo "ERROR: image chua co rclone (can Javis >= 0.55.154)"
              exit 1
            fi
            NAME="${REMOTE_NAME:-gdrive}"
            # Ghi token vào file tạm (tránh echo token ra log dài)
            B64=$(printf '%s' "$RCLONE_TOKEN" | base64 | tr -d '\n')
            docker exec -e RCLONE_CONFIG=/data/state/rclone.conf -e T="$B64" -e N="$NAME" "$CONTAINER" \
              bash -lc 'set -euo pipefail
                TOKEN=$(printf "%s" "$T" | base64 -d)
                rclone config delete "$N" 2>/dev/null || true
                rclone config create "$N" drive scope drive config_is_local false --non-interactive token "$TOKEN"
                rclone listremotes
              '
            echo "OK — remote ${NAME}: san sang. Trong Javis: Bo nao -> Kho Drive -> gdrive:"
