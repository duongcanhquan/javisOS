# Compose nhẹ: chạy image OpenMAIC đã build local (tag openmaic:local).
# TTS gọi Javis qua host.docker.internal:7777/v1 (Edge-TTS).

services:
  openmaic:
    image: openmaic:local
    container_name: openmaic
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.local
    volumes:
      - openmaic-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  openmaic-data:
