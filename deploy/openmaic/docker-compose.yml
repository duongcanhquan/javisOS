# Compose nhẹ: chạy image OpenMAIC đã build local (tag openmaic:local).
# Script vps-deploy-openmaic.sh sẽ clone upstream, build, rồi dùng file này
# hoặc docker compose trong thư mục clone — xem script.

services:
  openmaic:
    image: openmaic:local
    container_name: openmaic
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    volumes:
      - openmaic-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  openmaic-data:
