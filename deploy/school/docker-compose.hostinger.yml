# Javis OS - gói trường trên Hostinger (Docker Manager)
#
# URL dán vào Compose:
#   https://raw.githubusercontent.com/duongcanhquan/javisOS/main/deploy/school/docker-compose.hostinger.yml
#
# Environment hữu ích:
#   DOMAIN_NAME, JAVIS_ADMIN_USER, JAVIS_ADMIN_PASSWORD
# Bản thứ hai trên cùng VPS: thêm JAVIS_NAME + JAVIS_HOST_PORT (xem cuối file gốc hostinger).
#
# Cập nhật: Redeploy (image :latest + pull_policy: always).
# Hướng dẫn người dùng: CAI-DAT-TRUONG.md ở gốc repo.
services:
  javis:
    image: ${JAVIS_IMAGE:-ghcr.io/duongcanhquan/javisos:latest}
    container_name: ${JAVIS_NAME:-javis}
    restart: unless-stopped
    pull_policy: always
    command: ["sh", "-c", "JAVIS_DEPLOY_TARGET=hostinger exec python -m uvicorn main:app --app-dir server --host 0.0.0.0 --port 7777"]
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      JAVIS_ADMIN_USER: ${JAVIS_ADMIN_USER:-admin}
      JAVIS_ADMIN_PASSWORD: ${JAVIS_ADMIN_PASSWORD:-}
    ports:
      - "${JAVIS_HOST_PORT:-7777}:7777"
    labels:
      - org.opencontainers.image.documentation=https://github.com/duongcanhquan/javisOS/blob/main/CAI-DAT-TRUONG.md
      - org.opencontainers.image.source=https://github.com/duongcanhquan/javisOS
      - com.hostinger.documentation=https://github.com/duongcanhquan/javisOS/blob/main/CAI-DAT-TRUONG.md
      - com.hostinger.quickstart=https://github.com/duongcanhquan/javisOS/blob/main/deploy/school/README.md
      - traefik.enable=true
      - traefik.http.routers.${JAVIS_NAME:-javis}.rule=Host(`${DOMAIN_NAME:-localhost}`)
      - traefik.http.routers.${JAVIS_NAME:-javis}.entrypoints=websecure
      - traefik.http.routers.${JAVIS_NAME:-javis}.tls.certresolver=letsencrypt
      - traefik.http.routers.${JAVIS_NAME:-javis}.service=${JAVIS_NAME:-javis}
      - traefik.http.services.${JAVIS_NAME:-javis}.loadbalancer.server.port=7777
    volumes:
      - javis-data:/data
      - javis-brains:/brains
      - claude-auth:/home/javis/.claude
      - codex-auth:/home/javis/.codex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'+os.getenv('JAVIS_PORT','7777')+'/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  javis-data:
  javis-brains:
  claude-auth:
  codex-auth:
