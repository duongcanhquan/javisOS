# Pixelle-Video cạnh Javis — bật bằng --profile pixelle
# (scripts/setup-pixelle-vps.sh + vps-deploy.sh tự gọi khi JAVIS_ENABLE_PIXELLE!=false).
#
# Cần: vendor/Pixelle-Video đã clone + config.yaml (setup script lo).
# Javis gọi API qua PIXELLE_API_BASE=http://pixelle-api:8000 (cùng Docker network).

services:
  javis:
    environment:
      PIXELLE_API_BASE: ${PIXELLE_API_BASE:-http://pixelle-api:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  pixelle-api:
    profiles: ["pixelle"]
    build:
      context: ${PIXELLE_DIR:-./vendor/Pixelle-Video}
      dockerfile: Dockerfile
    container_name: ${JAVIS_NAME:-javis}-pixelle-api
    command: .venv/bin/python api/app.py --host 0.0.0.0 --port 8000
    ports:
      - "${PIXELLE_HOST_PORT:-8000}:8000"
    volumes:
      - ${PIXELLE_DIR:-./vendor/Pixelle-Video}/config.yaml:/app/config.yaml
      - pixelle-data:/app/data
      - pixelle-output:/app/output
    environment:
      TZ: Asia/Ho_Chi_Minh
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  pixelle-web:
    profiles: ["pixelle"]
    build:
      context: ${PIXELLE_DIR:-./vendor/Pixelle-Video}
      dockerfile: Dockerfile
    container_name: ${JAVIS_NAME:-javis}-pixelle-web
    command: .venv/bin/streamlit run web/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "${PIXELLE_WEB_PORT:-8501}:8501"
    volumes:
      - ${PIXELLE_DIR:-./vendor/Pixelle-Video}/config.yaml:/app/config.yaml
      - pixelle-data:/app/data
      - pixelle-output:/app/output
    environment:
      TZ: Asia/Ho_Chi_Minh
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pixelle-api
    restart: unless-stopped

volumes:
  pixelle-data:
  pixelle-output:
